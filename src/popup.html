<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="7" width="20" height="14" rx="2" fill="url(#lg1)" />
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" stroke="url(#lg2)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="19" cy="19" r="5" fill="#0a0b0f"/>
          <path d="M17 19l1.5 1.5L21 17" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="lg1" x1="2" y1="7" x2="22" y2="21" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#818cf8"/>
            </linearGradient>
            <linearGradient id="lg2" x1="8" y1="5" x2="16" y2="7" gradientUnits="userSpaceOnUse">
              <stop stop-color="#818cf8"/>
              <stop offset="1" stop-color="#a5b4fc"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h1 class="app-name">JobTracker</h1>
        <p class="app-sub" id="user-email">AI-powered Gmail tracker</p>
      </div>
    </div>
    <button class="icon-btn" id="btn-settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 0-1.41-1.42M4.93 4.93a10 10 0 0 0-1.42 1.41M4.93 19.07a10 10 0 0 0 1.41 1.42M19.07 19.07a10 10 0 0 0 1.42-1.41M12 2v2M12 20v2M2 12H4M20 12h2"/>
      </svg>
    </button>
  </header>

  <!-- Setup checklist — shown until all four steps are done -->
  <div id="setup-panel" class="state-panel setup-panel" style="display:none">
    <p class="state-title">Finish setup to start syncing</p>
    <p class="setup-note" id="setup-note" style="display:none"></p>
    <ul class="setup-list" id="setup-list"></ul>
    <button class="btn-primary full-width" id="btn-go-settings">Open Settings →</button>
  </div>

  <!-- Connected state -->
  <div id="connected-view">
    <!-- Stats grid -->
    <div class="stats-grid">
      <div class="stat-card stat-applied">
        <span class="stat-number" id="stat-applied">—</span>
        <span class="stat-label">Applied</span>
        <div class="stat-dot applied"></div>
      </div>
      <div class="stat-card stat-interview">
        <span class="stat-number" id="stat-interview">—</span>
        <span class="stat-label">Interviews</span>
        <div class="stat-dot interview"></div>
      </div>
      <div class="stat-card stat-offer">
        <span class="stat-number" id="stat-offer">—</span>
        <span class="stat-label">Offers</span>
        <div class="stat-dot offer"></div>
      </div>
      <div class="stat-card stat-rejected">
        <span class="stat-number" id="stat-rejected">—</span>
        <span class="stat-label">Rejected</span>
        <div class="stat-dot rejected"></div>
      </div>
    </div>

    <button class="review-hint" id="review-hint" style="display:none"></button>

    <!-- Sync section -->
    <div class="sync-section">
      <div class="sync-actions">
        <button class="btn-sync" id="btn-sync">
          <svg class="sync-icon" id="sync-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 12a9 9 0 0 1-9 9M3 12a9 9 0 0 1 9-9"/>
            <path d="M21 12l-3-3m3 3l-3 3"/>
          </svg>
          <span id="sync-label">Sync Now</span>
        </button>
        <button class="btn-stop-sync" id="btn-stop-sync" style="display:none">Stop</button>
      </div>
      <p class="last-synced" id="last-synced">Never synced</p>
      <p class="last-synced" id="sync-window"></p>
    </div>

    <!-- Status message -->
    <div class="status-msg" id="status-msg" style="display:none"></div>
  </div>

  <!-- Footer nav -->
  <footer class="footer">
    <button class="footer-btn" id="btn-dashboard">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
    </button>
    <div class="footer-divider"></div>
    <button class="footer-btn" id="btn-footer-settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 0-1.41-1.42M4.93 4.93a10 10 0 0 0-1.42 1.41M4.93 19.07a10 10 0 0 0 1.41 1.42M19.07 19.07a10 10 0 0 0 1.42-1.41"/>
      </svg>
      Settings
    </button>
  </footer>

  <script type="module" src="../dist/popup.js"></script>
</body>
</html>
